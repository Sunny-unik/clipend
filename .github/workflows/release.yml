name: Release

# Publishes to the PUBLIC clipend-releases repo whenever a v* tag is pushed
# on THIS (private) repo. Also runnable on-demand via the Actions tab.
#
# Requires a repo secret named RELEASES_TOKEN — a fine-grained Personal
# Access Token with Contents: Read and write scoped to sunny-unik/clipend-releases.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install JS deps
        run: bun install

      - name: Build and publish release to public repo
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        with:
          # Publish into the separate public repo
          owner: sunny-unik
          repo: clipend-releases
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-{1}', github.run_number, github.sha) }}
          releaseName: "Clipend ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}"
          releaseBody: |
            Windows installer is below. See the [README](https://github.com/sunny-unik/clipend-releases/blob/main/README.md) for full usage.

            > Windows shows "Microsoft Defender SmartScreen prevented an unrecognized app from starting" because the binary isn't code-signed. Click **More info → Run anyway**.
          releaseDraft: true
          prerelease: false
