name: Release

# Publishes to the PUBLIC clipend-releases repo whenever a v* tag is pushed
# on THIS (private) repo. Also runnable on-demand via the Actions tab.
#
# Requires a repo secret named RELEASES_TOKEN — a fine-grained Personal
# Access Token with Contents: Read and write scoped to sunny-unik/clipend-releases.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
    steps:
      - name: Compute tag/release names
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "release_name=Clipend ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v${{ github.run_number }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "release_name=Clipend build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release on clipend-releases
        id: create
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_TOKEN }}
          repository: sunny-unik/clipend-releases
          target_commitish: master
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          draft: true
          prerelease: false
          body: |
            Installers below for Windows (.exe) and Linux (.AppImage — runs on any modern distro). See the [README](https://github.com/sunny-unik/clipend-releases/blob/main/README.md) for usage.

            > **Windows** shows "Microsoft Defender SmartScreen prevented an unrecognized app from starting" because the binary isn't code-signed. Click **More info → Run anyway**.
            >
            > **Linux** — `chmod +x Clipend-*.AppImage && ./Clipend-*.AppImage`

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: appimage

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Install JS deps
        run: bun install

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # tauri-action reads GITHUB_TOKEN from env (no token: input), so
          # leave the env var here. The create-release job above uses the
          # explicit token: input on softprops/action-gh-release because
          # that action's token: input has a default of github.token, which
          # silently overrides any env var.
          #
          # Vite inlines VITE_* vars at build time. Without these the
          # binary ships with isSupabaseConfigured()=false → auth status
          # "disabled" → no Sign-in / Account UI.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          owner: sunny-unik
          repo: clipend-releases
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles ${{ matrix.bundles }}
